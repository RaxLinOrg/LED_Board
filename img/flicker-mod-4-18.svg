<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Helvetica,Arial,sans-serif">
  <rect width="980" height="620" fill="#15161a"/>

  <text x="30" y="48" fill="#ffffff" font-size="27" font-weight="bold">4 &#8596; 18 PWM / flicker mod</text>
  <text x="30" y="78" fill="#9aa0aa" font-size="16">Adafruit RGB Matrix Bonnet &#183; one short wire &#183; nothing else is changed</text>

  <!-- ===== Bonnet breakout row ===== -->
  <rect x="30" y="110" width="920" height="210" rx="10" fill="#1d1f25" stroke="#32353d"/>
  <text x="48" y="140" fill="#d8dce3" font-size="15" font-weight="bold">Bonnet GPIO breakout &#8212; read the silkscreen, left to right</text>

  <!-- pads: x positions -->
  <g>
    <!-- helper: each pad = circle + function label above + gpio number below -->
    <!-- SDA 2 -->
    <circle cx="90"  cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="90" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">SDA</text>
    <text x="90" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">2</text>
    <!-- SCL 3 -->
    <circle cx="165" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="165" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">SCL</text>
    <text x="165" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">3</text>
    <!-- TX 14 -->
    <circle cx="240" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="240" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">TX</text>
    <text x="240" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">14</text>
    <!-- RX 15 -->
    <circle cx="315" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="315" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">RX</text>
    <text x="315" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">15</text>

    <!-- OE 4  *** TARGET *** -->
    <circle cx="390" cy="215" r="19" fill="#10243a" stroke="#4fb6ff" stroke-width="5"/>
    <text x="390" y="183" fill="#4fb6ff" font-size="16" font-weight="bold" text-anchor="middle">OE</text>
    <text x="390" y="256" fill="#4fb6ff" font-size="17" font-weight="bold" text-anchor="middle">4</text>

    <!-- CLK 17 -->
    <circle cx="465" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="465" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">CLK</text>
    <text x="465" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">17</text>

    <!-- 18  *** TARGET *** (no function label) -->
    <circle cx="540" cy="215" r="19" fill="#10311a" stroke="#5de06a" stroke-width="5"/>
    <text x="540" y="183" fill="#5de06a" font-size="13" text-anchor="middle">(blank)</text>
    <text x="540" y="256" fill="#5de06a" font-size="17" font-weight="bold" text-anchor="middle">18</text>

    <!-- C 27 -->
    <circle cx="615" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="615" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">C</text>
    <text x="615" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">27</text>
    <!-- A 22 -->
    <circle cx="690" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="690" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">A</text>
    <text x="690" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">22</text>
    <!-- B2 23 -->
    <circle cx="765" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="765" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">B2</text>
    <text x="765" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">23</text>
    <!-- E 24 -->
    <circle cx="840" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="840" y="186" fill="#8e94a0" font-size="14" text-anchor="middle">E</text>
    <text x="840" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">24</text>
    <!-- 25 -->
    <circle cx="915" cy="215" r="15" fill="#2a2d35" stroke="#b08d57" stroke-width="4"/>
    <text x="915" y="252" fill="#8e94a0" font-size="14" text-anchor="middle">25</text>
  </g>

  <!-- the jumper wire -->
  <path d="M 390 215 C 420 150, 510 150, 540 215" stroke="#ffd02e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="465" y="140" fill="#ffd02e" font-size="15" font-weight="bold" text-anchor="middle">solder one wire</text>

  <text x="390" y="300" fill="#4fb6ff" font-size="13" text-anchor="middle">GPIO 4 = OE signal</text>
  <text x="540" y="300" fill="#5de06a" font-size="13" text-anchor="middle">GPIO 18 = unused</text>

  <!-- ===== alternative: Pi header ===== -->
  <rect x="30" y="345" width="450" height="245" rx="10" fill="#1d1f25" stroke="#32353d"/>
  <text x="48" y="375" fill="#d8dce3" font-size="15" font-weight="bold">Same two signals on the Pi 40-pin header</text>
  <text x="48" y="398" fill="#8e94a0" font-size="13">(use this only if you solder on the Pi instead of the bonnet)</text>

  <!-- header rows -->
  <text x="60" y="435" fill="#8e94a0" font-size="12">odd row</text>
  <text x="60" y="505" fill="#8e94a0" font-size="12">even row</text>
  <g>
    <circle cx="150" cy="430" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="150" y="412" fill="#777" font-size="11" text-anchor="middle">1</text>
    <circle cx="200" cy="430" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="200" y="412" fill="#777" font-size="11" text-anchor="middle">3</text>
    <circle cx="250" cy="430" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="250" y="412" fill="#777" font-size="11" text-anchor="middle">5</text>
    <circle cx="300" cy="430" r="15" fill="#10243a" stroke="#4fb6ff" stroke-width="5"/><text x="300" y="408" fill="#4fb6ff" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <circle cx="350" cy="430" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="350" y="412" fill="#777" font-size="11" text-anchor="middle">9</text>
    <circle cx="400" cy="430" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="400" y="412" fill="#777" font-size="11" text-anchor="middle">11</text>

    <circle cx="150" cy="500" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="150" y="528" fill="#777" font-size="11" text-anchor="middle">2</text>
    <circle cx="200" cy="500" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="200" y="528" fill="#777" font-size="11" text-anchor="middle">4</text>
    <circle cx="250" cy="500" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="250" y="528" fill="#777" font-size="11" text-anchor="middle">6</text>
    <circle cx="300" cy="500" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="300" y="528" fill="#777" font-size="11" text-anchor="middle">8</text>
    <circle cx="350" cy="500" r="11" fill="#2a2d35" stroke="#777" stroke-width="3"/><text x="350" y="528" fill="#777" font-size="11" text-anchor="middle">10</text>
    <circle cx="400" cy="500" r="15" fill="#10311a" stroke="#5de06a" stroke-width="5"/><text x="400" y="530" fill="#5de06a" font-size="13" font-weight="bold" text-anchor="middle">12</text>
  </g>
  <path d="M 300 430 C 330 460, 370 470, 400 500" stroke="#ffd02e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="150" y="565" fill="#4fb6ff" font-size="13">pin 7 = GPIO 4</text>
  <text x="300" y="565" fill="#5de06a" font-size="13">pin 12 = GPIO 18</text>

  <!-- ===== steps ===== -->
  <rect x="505" y="345" width="445" height="245" rx="10" fill="#1d1f25" stroke="#32353d"/>
  <text x="523" y="375" fill="#d8dce3" font-size="15" font-weight="bold">Steps</text>
  <text x="523" y="403" fill="#c3c8d2" font-size="13">1.  Power off. Unplug the PSU and the Pi.</text>
  <text x="523" y="428" fill="#c3c8d2" font-size="13">2.  Lift the bonnet off the Pi so you can reach the pads.</text>
  <text x="523" y="453" fill="#c3c8d2" font-size="13">3.  Solder a short wire (30 AWG is plenty) between</text>
  <text x="541" y="473" fill="#c3c8d2" font-size="13">the hole marked OE / 4 and the one marked 18.</text>
  <text x="523" y="498" fill="#c3c8d2" font-size="13">4.  Check for bridges to CLK / 17, which sits between them.</text>
  <text x="523" y="523" fill="#c3c8d2" font-size="13">5.  Reassemble, then run with:</text>
  <rect x="541" y="535" width="390" height="30" rx="5" fill="#0e0f12" stroke="#32353d"/>
  <text x="553" y="555" fill="#ffd02e" font-size="13" font-family="monospace">--led-gpio-mapping=adafruit-hat-pwm</text>
</svg>
